services:
  vision-worker:
    platform: linux/amd64
    # Explicit demo profile: no credentials, production data or network access.
    profiles: [vision]
    image: camera-monitoring-vision-worker:dev
    build:
      context: ./backend
      additional_contexts:
        wheels: ${VISION_WHEELHOUSE:-/tmp/camera-vision-wheels}
    command: [python, -m, app.vision, --config, /config/vision.json]
    environment:
      CAMERA_LEASE_DIRECTORY: /run/camera-leases
    volumes:
      - capture-leases:/run/camera-leases
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, python, -c, "import json,time; from pathlib import Path; p=Path('/tmp/vision-health.json'); d=json.loads(p.read_text()); assert d['healthy'] and time.time()-p.stat().st_mtime<15"]
      interval: 5s
      timeout: 2s
      start_period: 15s
      retries: 3

volumes:
  capture-leases:
    name: camera-monitoring-capture-leases
