name: Vision security and regression
on:
  pull_request:
  push:
    branches: [main, feat/ai-vision-platform]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vision-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ''
      SUPABASE_SECRET_KEY: ''
      FIREBASE_CREDENTIALS_PATH: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, reviewed immutable ref
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install reviewed binary-only snapshots
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-tooling.lock
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-ci.lock
          python -m pip check
      - name: Offline backend regression
        run: python -m pytest -q backend --disable-warnings --junitxml=artifacts/backend-tests.xml
      - name: Runtime closure and offline release image
        run: |
          python backend/scripts/build_runtime_lock.py --output artifacts/runtime.lock
          cmp backend/requirements-runtime.lock artifacts/runtime.lock
          python backend/scripts/prepare_release_wheels.py --output "$RUNNER_TEMP/vision-wheels"
          docker build --platform linux/amd64 --network none --build-context wheels="$RUNNER_TEMP/vision-wheels" -t camera-monitoring:ci backend
          python backend/scripts/download_vision_model.py --output "$RUNNER_TEMP/yolox_s.onnx"
          python backend/scripts/validate_release_image.py --image camera-monitoring:ci --model "$RUNNER_TEMP/yolox_s.onnx" --output artifacts/image-smoke
      - name: Disposable PostgreSQL isolation and rollback
        run: python backend/scripts/validate_database_security.py
      - name: Inventory and advisory snapshot
        if: always()
        run: python backend/scripts/release_inventory.py --output artifacts/inventory --pypi
      - name: Full image inventory and vulnerability gate
        run: |
          docker save -o "$RUNNER_TEMP/vision-image.tar" camera-monitoring:ci
          python backend/scripts/scan_release_image.py --archive "$RUNNER_TEMP/vision-image.tar" --cache "$RUNNER_TEMP/vision-scan-cache" --output artifacts/image-scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vision-security-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
