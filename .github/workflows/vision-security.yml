name: Vision security and regression
on:
  pull_request:
  push:
    branches: [main, feat/ai-vision-platform]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vision-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ''
      SUPABASE_SECRET_KEY: ''
      FIREBASE_CREDENTIALS_PATH: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, reviewed immutable ref
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install reviewed binary-only snapshots
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-tooling.lock
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-ci.lock
          python -m pip check
      - name: Offline backend regression
        run: python -m pytest -q backend --disable-warnings --junitxml=artifacts/backend-tests.xml
      - name: Disposable PostgreSQL isolation and rollback
        run: python backend/scripts/validate_database_security.py
      - name: Inventory and advisory snapshot
        if: always()
        run: python backend/scripts/release_inventory.py --output artifacts/inventory --pypi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vision-security-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
